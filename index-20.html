<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>하찮은 RPG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* layout: full-bleed 3D scene, HUD on top (stats left, quest right), touch controls bottom, start card over an orbiting village */
:root {
  --ink: #1b2b1e;
  --paper: #f7f2dd;
  --leaf: #6dbb52;
  --hp: #e0524a;
  --xp: #f2c14e;
  --sky: #9fd3f0;
  --glass: rgba(18, 32, 22, 0.66);
  --line: rgba(247, 242, 221, 0.2);
  --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  font-size: 15px;
  position: relative;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#stage { position: absolute; inset: 0; }
#c { display: block; width: 100%; height: 100%; touch-action: none; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.ft { position: absolute; left: 0; top: 0; font-family: var(--display); font-size: 20px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55); white-space: nowrap; will-change: transform; }
.ft.crit { color: var(--xp); font-size: 26px; }
.ft.hurt { color: #ff7d73; }
.ft.heal { color: #9be37f; }
.ft.exp { color: #ffe08a; font-size: 16px; }
.eb { position: absolute; left: 0; top: 0; width: 46px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.55); overflow: hidden; will-change: transform; }
.eb i { display: block; height: 100%; background: var(--hp); }

#ui {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); min-width: 0; }
#stats { width: min(200px, 48vw); display: flex; flex-direction: column; gap: 6px; }
.lvlrow { display: flex; align-items: center; gap: 8px; }
#lvl { font-family: var(--display); font-size: 18px; color: var(--xp); white-space: nowrap; }
.bar { position: relative; flex: 1; height: 16px; border-radius: 8px; background: rgba(0,0,0,.45); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left; }
.bar.hp i { background: linear-gradient(var(--hp), #b73a33); }
.bar.xp { height: 8px; flex: none; }
.bar.xp i { background: var(--xp); }
.bar b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 400; text-shadow: 0 1px 1px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
#gold { font-size: 13px; color: var(--xp); font-variant-numeric: tabular-nums; }
#online { font-size: 12px; color: var(--leaf); }
.nm { position: absolute; left: 0; top: 0; display: none; font-family: var(--display); font-size: 13px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85); white-space: nowrap; text-align: center; will-change: transform; }
.nmb { width: 44px; height: 5px; margin: 2px auto 0; border-radius: 3px; background: rgba(0,0,0,.55); overflow: hidden; }
.nmb i { display: block; height: 100%; background: #6dbb52; }
#nick { width: min(280px, 100%); font: inherit; font-size: 16px; text-align: center; color: var(--paper); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
#nick::placeholder { color: rgba(247,242,221,.55); }
.multi { font-size: 13px !important; color: var(--leaf) !important; }
#right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
#quest { width: min(210px, 46vw); }
#quest h3 { margin: 0 0 2px; font-family: var(--display); font-weight: 400; font-size: 13px; letter-spacing: .08em; color: var(--leaf); }
#qrow { display: flex; align-items: center; gap: 8px; }
#qtext { margin: 0; font-size: 14px; line-height: 1.35; flex: 1; min-width: 0; }
#arrow { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.35); font-size: 15px; color: var(--xp); }
#arrow small { position: absolute; transform: translateY(21px); font-size: 10px; color: var(--paper); }
#arrowwrap { position: relative; flex: none; padding-bottom: 12px; }
#btns { display: flex; gap: 6px; }
#set { pointer-events: auto; width: min(210px, 46vw); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
#set label { display: flex; justify-content: space-between; }
#set b { font-weight: 400; color: var(--xp); font-variant-numeric: tabular-nums; }
#sens { width: 100%; touch-action: pan-x; accent-color: var(--leaf); }
#mute, #gear, #bagbtn, #chatbtn, #partybtn, #questbtn { pointer-events: auto; font: inherit; font-size: 12px; color: var(--paper); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
#mute:focus-visible, #gear:focus-visible, #bagbtn:focus-visible, button:focus-visible { outline: 3px solid var(--xp); outline-offset: 2px; }
#toast { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); max-width: min(86vw, 440px); text-align: center; font-family: var(--display); font-size: 19px; text-shadow: 0 2px 0 rgba(0,0,0,.6); opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.on { opacity: 1; }

#bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
#joyArea { width: 132px; height: 132px; display: flex; align-items: flex-end; }
#joy { position: relative; width: 124px; height: 124px; border-radius: 50%; background: rgba(247,242,221,.12); border: 2px solid rgba(247,242,221,.35); pointer-events: auto; touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(247,242,221,.55); border: 2px solid rgba(247,242,221,.8); }
body.fine #joyArea { visibility: hidden; }
#hint { align-self: flex-end; font-size: 12px; color: rgba(247,242,221,.8); text-shadow: 0 1px 2px rgba(0,0,0,.8); text-align: center; flex: 1; min-width: 0; display: none; }
body.fine #hint { display: block; }
#acts { display: flex; align-items: flex-end; gap: 12px; }
.act { pointer-events: auto; touch-action: none; position: relative; border-radius: 50%; border: 2px solid rgba(247,242,221,.7); color: var(--paper); font-family: var(--display); cursor: pointer; display: grid; place-items: center; line-height: 1.05; text-align: center; overflow: hidden; }
.act small { display: block; font-family: var(--body); font-size: 10px; opacity: .85; }
#btnAtk { width: 88px; height: 88px; background: rgba(224,82,74,.78); font-size: 20px; }
#jd { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; margin-bottom: 4px; }
#btnJump { width: 54px; height: 54px; background: rgba(60,120,90,.8); font-size: 14px; }
#btnDash { width: 54px; height: 54px; background: rgba(226,160,50,.85); font-size: 14px; --cd: 0; }
#btnDash::after { content: ""; position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,.6) calc(var(--cd) * 360deg), transparent 0); }
#inv { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 24px)); min-height: min(260px, 60%); max-height: 76%; overflow-y: auto; pointer-events: auto; background: rgba(28,34,30,.94); color: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 14px; font-size: 14px; box-shadow: 0 8px 0 rgba(0,0,0,.3); z-index: 20; }
#inv.forging { top: auto; bottom: 12px; transform: translateX(-50%); min-height: 0; max-height: 40%; width: min(360px, calc(100% - 24px)); background: rgba(28,34,30,.72); padding: 8px 12px 10px; }
#inv[hidden] { display: none; }
#inv h3 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 20px; font-weight: 400; }
#inv h4 { margin: 12px 0 6px; font-family: var(--display); font-size: 15px; font-weight: 400; color: var(--xp); }
#inv button { font-family: var(--body); font-size: 13px; color: var(--ink); background: var(--xp); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
#inv button.off { background: rgba(255,255,255,.18); color: var(--paper); }
#inv .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
#inv .row .t { flex: 1; min-width: 0; }
#inv .row small { display: block; opacity: .75; font-size: 12px; }
#inv .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
#inv .tabs { display: flex; gap: 6px; margin-bottom: 6px; }
#inv .tabs button { flex: 1; background: rgba(255,255,255,.14); color: var(--paper); border-radius: 10px; padding: 8px 0; }
#inv .tabs button.on { background: var(--xp); color: var(--ink); }
#inv .stat { font-size: 12px; opacity: .85; line-height: 1.5; }
#inv .empty { opacity: .6; font-size: 13px; padding: 4px 0; }
#btnSkill { width: 64px; height: 64px; background: rgba(90,140,230,.78); font-size: 15px; margin-bottom: 40px; --cd: 0; }
#btnSk2 { width: 56px; height: 56px; background: rgba(170,100,230,.82); font-size: 12px; margin-bottom: 60px; --cd: 0; }
#btnSk2[hidden] { display: none; }
#btnSk2::after { content: ""; position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,.6) calc(var(--cd) * 360deg), transparent 0); }
#btnSkill::after { content: ""; position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,.6) calc(var(--cd) * 360deg), transparent 0); }
#talk { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); pointer-events: auto; font-family: var(--display); font-size: 18px; color: var(--ink); background: var(--xp); border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
#dialog { position: absolute; left: 50%; bottom: 28%; transform: translateX(-50%); width: min(480px, calc(100% - 32px)); pointer-events: auto; background: rgba(247,242,221,.96); color: var(--ink); border-radius: 16px; padding: 14px 16px 12px; box-shadow: 0 6px 0 rgba(0,0,0,.28); }
#dialog.nar { background: rgba(20,30,24,.95); color: var(--paper); }
#dialog.nar #dtext { font-style: italic; }
#dialog .who { font-family: var(--display); font-size: 16px; color: #3f7d2e; margin-bottom: 4px; }
#dialog p { margin: 0 0 10px; font-size: 16px; line-height: 1.5; text-wrap: pretty; }
#dnext { font-family: var(--display); font-size: 15px; background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 6px 18px; cursor: pointer; float: right; }
#dialog::after { content: ""; display: block; clear: both; }

#start, #dead {
  position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(14,26,17,.88), rgba(14,26,17,.35) 55%, rgba(14,26,17,0));
  overflow-y: auto;
}
#dead { align-items: center; background: rgba(60,14,12,.62); }
.card { width: min(460px, 100%); text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(38px, 11vw, 60px); line-height: 1.05; color: var(--paper); text-shadow: 0 4px 0 rgba(0,0,0,.45); text-wrap: balance; }
.card h1 em { font-style: normal; color: var(--leaf); }
.card p { margin: 0; font-size: 15px; line-height: 1.5; color: rgba(247,242,221,.92); text-wrap: balance; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; font-size: 13px; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; width: 100%; }
.keys span:nth-child(odd) { color: var(--xp); font-variant-numeric: tabular-nums; }
.big { font-family: var(--display); font-size: 24px; color: var(--ink); background: var(--leaf); border: 0; border-radius: 999px; padding: 12px 44px; cursor: pointer; box-shadow: 0 5px 0 #3d7a2a; }
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #3d7a2a; }
.link { font: inherit; font-size: 13px; color: rgba(247,242,221,.75); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 4px; }
#netmsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,14,12,.92); z-index: 60; pointer-events: auto; padding: 20px; }
#netmsg[hidden], #adm[hidden] { display: none; }
#adm, #party, #qlist { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 24px)); max-height: 80%; overflow-y: auto; pointer-events: auto; background: rgba(28,34,30,.97); color: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 14px; font-size: 14px; box-shadow: 0 8px 0 rgba(0,0,0,.3); z-index: 70; }
#adm h3, #party h3, #qlist h3 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 20px; font-weight: 400; }
#adm button, #party button, #qlist button { font-family: var(--body); font-size: 13px; color: var(--ink); background: var(--xp); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
#adm button.red, #party button.red, #qlist button.red { background: #e0605a; color: #fff; }
#adm button.off, #party button.off, #qlist button.off { background: rgba(255,255,255,.18); color: var(--paper); }
#adm .row, #party .row, #qlist .row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
#adm .row .t, #party .row .t, #qlist .row .t { flex: 1; min-width: 0; }
#adm .stat, #party .stat, #qlist .stat { font-size: 13px; opacity: .85; margin: 4px 0 8px; }
#adm .acts, #party .acts, #qlist .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
#notice { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); max-width: min(520px, calc(100% - 28px)); background: rgba(20,26,22,.92); color: var(--paper); border: 2px solid var(--xp); border-radius: 14px; padding: 10px 16px; font-size: 16px; text-align: center; z-index: 55; pointer-events: none; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
#notice[hidden] { display: none; }
#pinv { position: absolute; left: 50%; top: 16%; transform: translateX(-50%); width: min(340px, calc(100% - 24px)); background: rgba(28,34,30,.97); color: var(--paper); border: 2px solid var(--xp); border-radius: 14px; padding: 12px 14px; z-index: 65; pointer-events: auto; text-align: center; font-size: 15px; }
#pinv[hidden] { display: none; }
#pinv button { font-family: var(--body); font-size: 14px; color: var(--ink); background: var(--xp); border: 0; border-radius: 999px; padding: 7px 16px; margin: 8px 4px 0; cursor: pointer; }
#pinv button.off { background: rgba(255,255,255,.18); color: var(--paper); }
#party[hidden], #qlist[hidden] { display: none; }
#qlist small { display: block; opacity: .75; font-size: 12px; }
#qlist .row.done { opacity: .5; }
#bossbar { position: absolute; left: 50%; top: 26px; transform: translateX(-50%); width: min(300px, 70vw); z-index: 31; pointer-events: none; text-align: center; color: #fff; text-shadow: 0 1px 3px #000; }
#bossbar[hidden] { display: none; }
#bossbar .bn { font-family: var(--display); font-size: 13px; letter-spacing: .06em; }
#bossbar .bb { height: 12px; border-radius: 7px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.4); overflow: hidden; margin: 2px 0; }
#bossbar .bb i { display: block; height: 100%; width: 100%; background: linear-gradient(#ffd34d, #c08a10); transition: width .15s; }
#bossbar.rage .bb i { background: linear-gradient(#ff6a5a, #b02020); }
#bossbar .bh { font-size: 10px; opacity: .85; }
#zonetag { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: rgba(20,26,22,.78); color: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12px; z-index: 30; pointer-events: none; white-space: nowrap; }
#zonetag.hot { color: #ff9a8a; border-color: #ff6a5a; }
#zonebig { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); text-align: center; color: #fff; font-weight: 900; text-shadow: 0 3px 10px #000; z-index: 40; pointer-events: none; transition: opacity .6s; opacity: 0; }
#zonebig b { display: block; font-size: 28px; } #zonebig span { font-size: 16px; }
#chatbar { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: flex; gap: 6px; width: min(360px, calc(100% - 28px)); z-index: 60; pointer-events: auto; }
#chatbar[hidden] { display: none; }
#chatin { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--paper); background: rgba(20,26,22,.92); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; user-select: text; -webkit-user-select: text; }
#chatsend { font: inherit; font-size: 14px; color: var(--paper); background: rgba(20,26,22,.92); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
#clog { position: absolute; left: 10px; bottom: 150px; max-width: min(300px, 60%); font-size: 13px; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; z-index: 20; }
#clog div { background: rgba(0,0,0,.35); border-radius: 8px; padding: 2px 8px; margin-top: 3px; word-break: break-all; transition: opacity .6s; }
.cb { display: none; background: rgba(255,255,255,.95); color: #222; text-shadow: none; border-radius: 10px; padding: 3px 9px; margin-bottom: 3px; max-width: 200px; white-space: normal; word-break: break-all; font-size: 13px; }
#vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(224,40,30,.75); opacity: 0; transition: opacity .35s; }
#vignette.on { opacity: 1; transition: opacity 0s; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-height: 460px) { #talk { bottom: 120px; } #dialog { bottom: 24%; } #toast { top: 60px; } }

/* ---- 작은 화면용: 전체 UI 축소 ---- */
#ui { padding-block: 8px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.panel { padding: 5px 8px; border-radius: 10px; }
#stats { width: min(150px, 40vw); gap: 4px; }
#lvl { font-size: 14px; } .lvlrow { gap: 6px; }
.bar { height: 12px; } .bar.xp { height: 6px; } .bar b { font-size: 9px; }

#quest { width: min(165px, 40vw); } #quest h3 { font-size: 10px; } #qtext { font-size: 11px; } #arrow { width: 24px; height: 24px; font-size: 12px; }
#mute, #gear, #bagbtn, #chatbtn, #partybtn, #questbtn { font-size: 10px; padding: 3px 8px; }
#btns { gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
#toast { top: 52px; font-size: 14px; }
#joyArea { width: 104px; height: 104px; } #joy { width: 98px; height: 98px; } #knob { width: 40px; height: 40px; margin: -20px 0 0 -20px; }
#acts { gap: 8px; } .act small { font-size: 8px; }
#btnAtk { width: 68px; height: 68px; font-size: 16px; }
#btnJump, #btnDash { width: 44px; height: 44px; font-size: 11px; }
#btnSkill { width: 52px; height: 52px; font-size: 12px; margin-bottom: 30px; }
#btnSk2 { width: 46px; height: 46px; font-size: 14px; margin-bottom: 48px; } #btnSk2 small { font-size: 8px; }
#jd { gap: 6px; }
#hint { font-size: 10px; }
.ft { font-size: 15px; } .ft.crit { font-size: 19px; } .ft.exp { font-size: 12px; }
.nm { font-size: 11px; } .nmb { width: 36px; height: 4px; } .eb { width: 38px; height: 5px; }
#inv, #adm, #party, #qlist { width: min(320px, calc(100% - 20px)); font-size: 12px; padding: 8px 10px 10px; border-radius: 12px; }
#inv h3, #adm h3, #party h3, #qlist h3 { font-size: 16px; margin-bottom: 6px; }
#inv button, #adm button, #party button, #qlist button { font-size: 11px; padding: 4px 9px; }
#inv .row, #adm .row, #party .row, #qlist .row { padding: 4px 0; gap: 6px; }
#inv .row small, #qlist small { font-size: 10px; }
#inv .tabs button { padding: 5px 0; font-size: 11px; }
#inv .stat, #adm .stat, #party .stat, #qlist .stat { font-size: 11px; }
#zonetag { font-size: 10px; padding: 2px 9px; top: 5px; } #zonebig b { font-size: 20px; } #zonebig span { font-size: 12px; }
#talk { font-size: 14px; bottom: 118px; }

<script>
/* 서버 접속 어댑터: 게임이 쓰는 room 인터페이스를 웹소켓으로 구현해요. claude.ai 안에서는 쓰지 않아요. */
(function () {
  if (window.claude && window.claude.use) return;
  var url = null;
  try {
    var q = new URLSearchParams(location.search).get('server');
    if (q) url = q;
    else if (location.protocol === 'http:' || location.protocol === 'https:') url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  } catch (e) { url = null; }
  var ws = null, up = false, myId = null, snap = [], local = {}, pl = [], cl = [], retry = 0, timer = 0, began = false, noRetry = false, admL = [];
  function netEvt(type, reason) { var d = { type: type, reason: reason }; window.rpgNetLast = d; try { window.dispatchEvent(new CustomEvent('rpg-net', { detail: d })); } catch (e) { /* ignore */ } }
  function build(list) {
    var now = Date.now();
    return list.map(function (x) {
      return Object.freeze({ peer: x.i, by: null, isMe: x.i === myId, sameTab: x.i === myId, kind: 'viewer', guest: false, presence: x.p || {}, updatedAt: now });
    });
  }
  function firePeers() { var c = { peers: snap, joined: [], left: [], updated: [] }; pl.forEach(function (f) { try { f(c); } catch (e) { /* listener error */ } }); }
  function fireConn() { cl.forEach(function (f) { try { f(up); } catch (e) { /* listener error */ } }); }
  function sendP(d) { if (ws && ws.readyState === 1 && up) ws.send(JSON.stringify({ t: 'p', d: d })); }
  function schedule() { clearTimeout(timer); retry++; timer = setTimeout(connect, Math.min(5000, 500 * retry)); }
  function connect() {
    try { ws = new WebSocket(url); } catch (e) { schedule(); return; }
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'hi') { myId = m.id; up = true; retry = 0; fireConn(); sendP(local); }
      else if (m.t === 's') { snap = build(m.peers || []); firePeers(); }
      else if (m.t === 'a') { admL.forEach(function (f) { try { f(m); } catch (e) { /* ignore */ } }); }
      else if (m.t === 'kick') { noRetry = true; netEvt('kick', m.reason); }
      else if (m.t === 'closed') { noRetry = true; netEvt('closed'); }
      else if (m.t === 'opened') { location.reload(); }
      else if (m.t === 'notice') { try { window.dispatchEvent(new CustomEvent('rpg-notice', { detail: { text: String(m.text || ''), reset: m.reset ? 1 : 0 } })); } catch (e) { /* ignore */ } }
    };
    ws.onclose = function () { var was = up; up = false; snap = []; myId = null; if (was) fireConn(); if (!noRetry) schedule(); };
    ws.onerror = function () { try { ws.close(); } catch (e) { /* already closed */ } };
  }
  var room = {
    connected: function () { return up; },
    onConnection: function (f) { cl.push(f); setTimeout(function () { f(up); }, 0); return function () { cl = cl.filter(function (x) { return x !== f; }); }; },
    peers: function () { return snap; },
    onPeers: function (f) { pl.push(f); return function () { pl = pl.filter(function (x) { return x !== f; }); }; },
    presence: function (patch) {
      for (var k in patch) { if (patch[k] === null) delete local[k]; else local[k] = patch[k]; }
      sendP(patch);
      return Promise.resolve();
    },
    emit: function () { return Promise.resolve(); },
    on: function () { return function () { /* no topics */ }; }
  };
  window.rpgAdmin = {
    auth: function (pw) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'auth', pw: pw })); },
    cmd: function (o) { if (ws && ws.readyState === 1) { o.t = 'adm'; ws.send(JSON.stringify(o)); } },
    on: function (f) { admL.push(f); }
  };
  window.claude = {
    use: function (name) {
      if (name !== 'room' || !url) return Promise.resolve(null);
      if (!began) { began = true; connect(); }
      return Promise.resolve(room);
    }
  };
})();
</script>

      if (started && !P.dead && pd < (pk.kind ? 1.3 : 1.6)) {
        if (pk.kind === 'goo') {
          bag.goo[pk.lv] = (bag.goo[pk.lv] || 0) + 1;
          popText('+' + GOO[pk.lv][0], P.x, P.y + 2.6, P.z, 'exp'); sfx(600 + Math.random() * 200, 0.1, 'sine', 0.05, 900);
          renderInv(); save();
        } else if (pk.kind === 'log') {
          bag.log = (bag.log || 0) + 1; qadd('log', 1);
          popText('+통나무', P.x, P.y + 2.6, P.z, 'exp'); sfx(300 + Math.random() * 80, 0.1, 'square', 0.04, 200);
          renderInv(); save();
        } else if (pk.kind === 'jel') {
          bag.jel[pk.lv] = (bag.jel[pk.lv] || 0) + 1; qadd('jel', 1);
          popText('+' + JEL[pk.lv][0], P.x, P.y + 2.6, P.z, 'exp'); sfx(800 + Math.random() * 300, 0.1, 'triangle', 0.05, 1200);
          renderInv(); save();
        } else if (pk.kind === 'skill') {
          gainSkill(pk.id);
        } else if (pk.kind === 'acc') {
          if (!gainAcc(pk.id)) { continue; }
        } else {
          var heal = 25 + P.lvl * 3; P.hp = Math.min(P.max, P.hp + heal);
          popText('+' + heal, P.x, P.y + 2.8, P.z, 'heal'); sfx(700, 0.2, 'triangle', 0.06, 1200);
        }
        scene.remove(pk.m); pickups.splice(i, 1); continue;
      }
      if (pk.life <= 0) { scene.remove(pk.m); pickups.splice(i, 1); }
    }
    for (var pi = parts2.length - 1; pi >= 0; pi--) {
      var p = parts2[pi]; p.life -= dt; p.vy -= 14 * dt;
      p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
      p.m.rotation.x += dt * 8; p.m.rotation.y += dt * 6;
      if (p.life <= 0) { scene.remove(p.m); parts2.splice(pi, 1); }
    }
    for (var ri = rings.length - 1; ri >= 0; ri--) {
      var r = rings[ri]; r.t += dt; var k = r.t / r.dur;
      r.m.scale.setScalar(0.3 + (r.r - 0.3) * Math.min(1, k)); r.m.material.opacity = Math.max(0, 0.85 * (1 - k));
      if (k >= 1) { scene.remove(r.m); r.m.material.dispose(); rings.splice(ri, 1); }
    }
    for (var xi = texts.length - 1; xi >= 0; xi--) {
      var tx2 = texts[xi]; tx2.life -= dt; tx2.y += dt * 1.6;
      var sp = toScreen(tx2.x, tx2.y, tx2.z);
      if (sp) { tx2.el.style.transform = 'translate(' + sp.x.toFixed(1) + 'px,' + sp.y.toFixed(1) + 'px) translate(-50%,-50%)'; tx2.el.style.opacity = Math.min(1, tx2.life * 2.5); }
      if (tx2.life <= 0) { tx2.el.remove(); texts.splice(xi, 1); }
    }
    if (started) enemies.forEach(function (e) {
      if (e.dead || e.hitT <= 0) { if (e.bar && (e.dead || e.hitT <= 0)) { e.bar.remove(); e.bar = null; } return; }
      if (!e.bar) { e.bar = document.createElement('div'); e.bar.className = 'eb'; e.bar.innerHTML = '<i></i>'; fxEl.appendChild(e.bar); }
      var s = toScreen(e.x, e.y + 2.0 * e.sc, e.z);
      if (s) { e.bar.style.transform = 'translate(' + (s.x - 23).toFixed(1) + 'px,' + s.y.toFixed(1) + 'px)'; e.bar.firstChild.style.width = Math.max(0, e.hp / e.max * 100) + '%'; }
    });
    updateCamera(dt);
    sun.position.set(P.x + SUNOFF.x, P.y + SUNOFF.y, P.z + SUNOFF.z);
    sun.target.position.set(P.x, P.y, P.z);
    renderer.render(scene, camera);
  }

  /* ---------- start ---------- */
  function placeHero() { P.y = hgt(P.x, P.z); hero.position.set(P.x, P.y, P.z); hero.rotation.y = P.face; }
  placeHero();
  enemies.forEach(function (e) { e.y = hgt(e.x, e.z); e.g.position.set(e.x, e.y, e.z); });
  updateHUD();
  $('go').addEventListener('click', function () {
    try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; }
    if (saved) applySave(saved);
    nick = ($('nick').value || '').trim().slice(0, 10) || ('모험가' + (10 + Math.floor(Math.random() * 90)));
    try { localStorage.setItem('slimeforest-nick', nick); } catch (e) { /* ignore */ }
    startNet();
    started = true; $('start').hidden = true;
    if (!story.intro) { story.intro = true; setTimeout(function () { if (!dialogOpen) runScript(INTRO); }, 700); }
    camYaw = 0; camPitch = 0.5; camDist = 11; camPos.set(P.x, P.y + 6, P.z + 10); applyWeaponLook();
    updateHUD();
    toast(isTouch ? '왼쪽 조이스틱으로 이동, 오른쪽 버튼으로 공격' : 'WASD로 이동, 좌클릭으로 공격, 우클릭 드래그로 시점 회전', 3.4);
    sfx(520, 0.15, 'triangle', 0.06, 780);
  });
  frame();
})();
</script>
