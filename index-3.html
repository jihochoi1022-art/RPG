<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>하찮은 RPG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* layout: full-bleed 3D scene, HUD on top (stats left, quest right), touch controls bottom, start card over an orbiting village */
:root {
  --ink: #1b2b1e;
  --paper: #f7f2dd;
  --leaf: #6dbb52;
  --hp: #e0524a;
  --xp: #f2c14e;
  --sky: #9fd3f0;
  --glass: rgba(18, 32, 22, 0.66);
  --line: rgba(247, 242, 221, 0.2);
  --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  font-size: 15px;
  position: relative;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#stage { position: absolute; inset: 0; }
#c { display: block; width: 100%; height: 100%; touch-action: none; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.ft { position: absolute; left: 0; top: 0; font-family: var(--display); font-size: 20px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55); white-space: nowrap; will-change: transform; }
.ft.crit { color: var(--xp); font-size: 26px; }
.ft.hurt { color: #ff7d73; }
.ft.heal { color: #9be37f; }
.ft.exp { color: #ffe08a; font-size: 16px; }
.eb { position: absolute; left: 0; top: 0; width: 46px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.55); overflow: hidden; will-change: transform; }
.eb i { display: block; height: 100%; background: var(--hp); }

#ui {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); min-width: 0; }
#stats { width: min(200px, 48vw); display: flex; flex-direction: column; gap: 6px; }
.lvlrow { display: flex; align-items: center; gap: 8px; }
#lvl { font-family: var(--display); font-size: 18px; color: var(--xp); white-space: nowrap; }
.bar { position: relative; flex: 1; height: 16px; border-radius: 8px; background: rgba(0,0,0,.45); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left; }
.bar.hp i { background: linear-gradient(var(--hp), #b73a33); }
.bar.xp { height: 8px; flex: none; }
.bar.xp i { background: var(--xp); }
.bar b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 400; text-shadow: 0 1px 1px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
#gold { font-size: 13px; color: var(--xp); font-variant-numeric: tabular-nums; }
#online { font-size: 12px; color: var(--leaf); }
.nm { position: absolute; left: 0; top: 0; display: none; font-family: var(--display); font-size: 13px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.85); white-space: nowrap; text-align: center; will-change: transform; }
.nmb { width: 44px; height: 5px; margin: 2px auto 0; border-radius: 3px; background: rgba(0,0,0,.55); overflow: hidden; }
.nmb i { display: block; height: 100%; background: #6dbb52; }
#nick { width: min(280px, 100%); font: inherit; font-size: 16px; text-align: center; color: var(--paper); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
#nick::placeholder { color: rgba(247,242,221,.55); }
.multi { font-size: 13px !important; color: var(--leaf) !important; }
#right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
#quest { width: min(210px, 46vw); }
#quest h3 { margin: 0 0 2px; font-family: var(--display); font-weight: 400; font-size: 13px; letter-spacing: .08em; color: var(--leaf); }
#qrow { display: flex; align-items: center; gap: 8px; }
#qtext { margin: 0; font-size: 14px; line-height: 1.35; flex: 1; min-width: 0; }
#arrow { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.35); font-size: 15px; color: var(--xp); }
#arrow small { position: absolute; transform: translateY(21px); font-size: 10px; color: var(--paper); }
#arrowwrap { position: relative; flex: none; padding-bottom: 12px; }
#btns { display: flex; gap: 6px; }
#set { pointer-events: auto; width: min(210px, 46vw); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
#set label { display: flex; justify-content: space-between; }
#set b { font-weight: 400; color: var(--xp); font-variant-numeric: tabular-nums; }
#sens { width: 100%; touch-action: pan-x; accent-color: var(--leaf); }
#mute, #gear, #bagbtn { pointer-events: auto; font: inherit; font-size: 12px; color: var(--paper); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
#mute:focus-visible, #gear:focus-visible, #bagbtn:focus-visible, button:focus-visible { outline: 3px solid var(--xp); outline-offset: 2px; }
#toast { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); max-width: min(86vw, 440px); text-align: center; font-family: var(--display); font-size: 19px; text-shadow: 0 2px 0 rgba(0,0,0,.6); opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.on { opacity: 1; }

#bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
#joyArea { width: 132px; height: 132px; display: flex; align-items: flex-end; }
#joy { position: relative; width: 124px; height: 124px; border-radius: 50%; background: rgba(247,242,221,.12); border: 2px solid rgba(247,242,221,.35); pointer-events: auto; touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(247,242,221,.55); border: 2px solid rgba(247,242,221,.8); }
body.fine #joyArea { visibility: hidden; }
#hint { align-self: flex-end; font-size: 12px; color: rgba(247,242,221,.8); text-shadow: 0 1px 2px rgba(0,0,0,.8); text-align: center; flex: 1; min-width: 0; display: none; }
body.fine #hint { display: block; }
#acts { display: flex; align-items: flex-end; gap: 12px; }
.act { pointer-events: auto; touch-action: none; position: relative; border-radius: 50%; border: 2px solid rgba(247,242,221,.7); color: var(--paper); font-family: var(--display); cursor: pointer; display: grid; place-items: center; line-height: 1.05; text-align: center; overflow: hidden; }
.act small { display: block; font-family: var(--body); font-size: 10px; opacity: .85; }
#btnAtk { width: 88px; height: 88px; background: rgba(224,82,74,.78); font-size: 20px; }
#jd { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; margin-bottom: 4px; }
#btnJump { width: 54px; height: 54px; background: rgba(60,120,90,.8); font-size: 14px; }
#btnDash { width: 54px; height: 54px; background: rgba(226,160,50,.85); font-size: 14px; --cd: 0; }
#btnDash::after { content: ""; position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,.6) calc(var(--cd) * 360deg), transparent 0); }
#inv { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 24px)); min-height: min(260px, 60%); max-height: 76%; overflow-y: auto; pointer-events: auto; background: rgba(28,34,30,.94); color: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 14px; font-size: 14px; box-shadow: 0 8px 0 rgba(0,0,0,.3); z-index: 20; }
#inv[hidden] { display: none; }
#inv h3 { margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 20px; font-weight: 400; }
#inv h4 { margin: 12px 0 6px; font-family: var(--display); font-size: 15px; font-weight: 400; color: var(--xp); }
#inv button { font-family: var(--body); font-size: 13px; color: var(--ink); background: var(--xp); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
#inv button.off { background: rgba(255,255,255,.18); color: var(--paper); }
#inv .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
#inv .row .t { flex: 1; min-width: 0; }
#inv .row small { display: block; opacity: .75; font-size: 12px; }
#inv .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
#inv .tabs { display: flex; gap: 6px; margin-bottom: 6px; }
#inv .tabs button { flex: 1; background: rgba(255,255,255,.14); color: var(--paper); border-radius: 10px; padding: 8px 0; }
#inv .tabs button.on { background: var(--xp); color: var(--ink); }
#inv .stat { font-size: 12px; opacity: .85; line-height: 1.5; }
#inv .empty { opacity: .6; font-size: 13px; padding: 4px 0; }
#btnSkill { width: 64px; height: 64px; background: rgba(90,140,230,.78); font-size: 15px; margin-bottom: 40px; --cd: 0; }
#btnSkill::after { content: ""; position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,.6) calc(var(--cd) * 360deg), transparent 0); }
#talk { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); pointer-events: auto; font-family: var(--display); font-size: 18px; color: var(--ink); background: var(--xp); border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
#dialog { position: absolute; left: 50%; bottom: 28%; transform: translateX(-50%); width: min(480px, calc(100% - 32px)); pointer-events: auto; background: rgba(247,242,221,.96); color: var(--ink); border-radius: 16px; padding: 14px 16px 12px; box-shadow: 0 6px 0 rgba(0,0,0,.28); }
#dialog.nar { background: rgba(20,30,24,.95); color: var(--paper); }
#dialog.nar #dtext { font-style: italic; }
#dialog .who { font-family: var(--display); font-size: 16px; color: #3f7d2e; margin-bottom: 4px; }
#dialog p { margin: 0 0 10px; font-size: 16px; line-height: 1.5; text-wrap: pretty; }
#dnext { font-family: var(--display); font-size: 15px; background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 6px 18px; cursor: pointer; float: right; }
#dialog::after { content: ""; display: block; clear: both; }

#start, #dead {
  position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(14,26,17,.88), rgba(14,26,17,.35) 55%, rgba(14,26,17,0));
  overflow-y: auto;
}
#dead { align-items: center; background: rgba(60,14,12,.62); }
.card { width: min(460px, 100%); text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(38px, 11vw, 60px); line-height: 1.05; color: var(--paper); text-shadow: 0 4px 0 rgba(0,0,0,.45); text-wrap: balance; }
.card h1 em { font-style: normal; color: var(--leaf); }
.card p { margin: 0; font-size: 15px; line-height: 1.5; color: rgba(247,242,221,.92); text-wrap: balance; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; font-size: 13px; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; width: 100%; }
.keys span:nth-child(odd) { color: var(--xp); font-variant-numeric: tabular-nums; }
.big { font-family: var(--display); font-size: 24px; color: var(--ink); background: var(--leaf); border: 0; border-radius: 999px; padding: 12px 44px; cursor: pointer; box-shadow: 0 5px 0 #3d7a2a; }
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #3d7a2a; }
.link { font: inherit; font-size: 13px; color: rgba(247,242,221,.75); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 4px; }
#vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(224,40,30,.75); opacity: 0; transition: opacity .35s; }
#vignette.on { opacity: 1; transition: opacity 0s; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-height: 460px) { #talk { bottom: 120px; } #dialog { bottom: 24%; } #toast { top: 60px; } }
</style>

<div id="stage"><canvas id="c"></canvas></div>
<div id="fx"></div>
<div id="vignette"></div>

<div id="ui">
  <div id="top">
    <div id="stats" class="panel">
      <div class="lvlrow"><span id="lvl">Lv.1</span><div class="bar hp"><i id="hpf"></i><b id="hpt">100 / 100</b></div></div>
      <div class="bar xp"><i id="xpf"></i></div>
      <div id="gold">0 골드</div>
      <div id="online">혼자 플레이 중</div>
    </div>
    <div id="right">
      <div id="quest" class="panel">
        <h3>퀘스트</h3>
        <div id="qrow">
          <p id="qtext">마을 촌장과 대화하기</p>
          <div id="arrowwrap"><div id="arrow">▲<small id="adist"></small></div></div>
        </div>
      </div>
      <div id="btns">
        <button id="mute" type="button">소리 켜짐</button>
        <button id="bagbtn" type="button">가방</button>
        <button id="gear" type="button">설정</button>
      </div>
      <div id="set" class="panel" hidden>
        <label for="sens">시점 감도 <b id="sensv">1.0</b></label>
        <input id="sens" type="range" min="0.3" max="3" step="0.1" value="1">
      </div>
    </div>
  </div>
  <div id="inv" hidden></div>
  <div id="toast"></div>
  <button id="talk" type="button" hidden>촌장과 대화 (E)</button>
  <div id="dialog" hidden>
    <div class="who" id="dwho">촌장 할아버지</div>
    <p id="dtext"></p>
    <button id="dnext" type="button">다음</button>
  </div>
  <div id="bottom">
    <div id="joyArea"><div id="joy"><div id="knob"></div></div></div>
    <div id="hint">이동 WASD · 공격 좌클릭 · 점프 Space · 대쉬 Shift · 스킬 Q(ㅂ) · 가방 I · 대화 E<br>우클릭 드래그로 시점, 휠로 확대</div>
    <div id="acts">
      <div id="jd">
        <button id="btnDash" class="act" type="button">대쉬<small>Shift</small></button>
        <button id="btnJump" class="act" type="button">점프<small>Space</small></button>
      </div>
      <button id="btnSkill" class="act" type="button">회전<small>Q</small></button>
      <button id="btnAtk" class="act" type="button">공격<small>클릭</small></button>
    </div>
  </div>
</div>

<div id="start">
  <div class="card">
    <h1>하찮은<br><em>RPG</em></h1>
    <p>길을 잘못 들어 용사 대접을 받게 된 하찮은 모험가의 이야기. 슬라임을 물리치고 마을의 소원 구슬을 되찾으세요.</p>
    <div class="keys" id="keys"></div>
    <p class="multi">같은 링크를 연 사람끼리 한 숲에서 함께 모험해요.</p>
    <input id="nick" type="text" maxlength="10" placeholder="닉네임 (머리 위에 표시돼요)" autocomplete="off" aria-label="닉네임">
    <button id="go" class="big" type="button">시작</button>
    <button id="reset" class="link" type="button" hidden>처음부터 다시 하기</button>
  </div>
</div>

<div id="dead" hidden>
  <div class="card">
    <h1>쓰러졌다…</h1>
    <p>골드를 조금 잃었지만 레벨과 퀘스트는 그대로예요.</p>
    <button id="revive" class="big" type="button">마을에서 일어나기</button>
  </div>
</div>

<script>
/* 서버 접속 어댑터: 게임이 쓰는 room 인터페이스를 웹소켓으로 구현해요. claude.ai 안에서는 쓰지 않아요. */
(function () {
  if (window.claude && window.claude.use) return;
  var url = null;
  try {
    var q = new URLSearchParams(location.search).get('server');
    if (q) url = q;
    else if (location.protocol === 'http:' || location.protocol === 'https:') url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  } catch (e) { url = null; }
  var ws = null, up = false, myId = null, snap = [], local = {}, pl = [], cl = [], retry = 0, timer = 0, began = false;
  function build(list) {
    var now = Date.now();
    return list.map(function (x) {
      return Object.freeze({ peer: x.i, by: null, isMe: x.i === myId, sameTab: x.i === myId, kind: 'viewer', guest: false, presence: x.p || {}, updatedAt: now });
    });
  }
  function firePeers() { var c = { peers: snap, joined: [], left: [], updated: [] }; pl.forEach(function (f) { try { f(c); } catch (e) { /* listener error */ } }); }
  function fireConn() { cl.forEach(function (f) { try { f(up); } catch (e) { /* listener error */ } }); }
  function sendP(d) { if (ws && ws.readyState === 1 && up) ws.send(JSON.stringify({ t: 'p', d: d })); }
  function schedule() { clearTimeout(timer); retry++; timer = setTimeout(connect, Math.min(5000, 500 * retry)); }
  function connect() {
    try { ws = new WebSocket(url); } catch (e) { schedule(); return; }
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'hi') { myId = m.id; up = true; retry = 0; fireConn(); sendP(local); }
      else if (m.t === 's') { snap = build(m.peers || []); firePeers(); }
    };
    ws.onclose = function () { var was = up; up = false; snap = []; myId = null; if (was) fireConn(); schedule(); };
    ws.onerror = function () { try { ws.close(); } catch (e) { /* already closed */ } };
  }
  var room = {
    connected: function () { return up; },
    onConnection: function (f) { cl.push(f); setTimeout(function () { f(up); }, 0); return function () { cl = cl.filter(function (x) { return x !== f; }); }; },
    peers: function () { return snap; },
    onPeers: function (f) { pl.push(f); return function () { pl = pl.filter(function (x) { return x !== f; }); }; },
    presence: function (patch) {
      for (var k in patch) { if (patch[k] === null) delete local[k]; else local[k] = patch[k]; }
      sendP(patch);
      return Promise.resolve();
    },
    emit: function () { return Promise.resolve(); },
    on: function () { return function () { /* no topics */ }; }
  };
  window.claude = {
    use: function (name) {
      if (name !== 'room' || !url) return Promise.resolve(null);
      if (!began) { began = true; connect(); }
      return Promise.resolve(room);
    }
  };
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (!isTouch) document.body.classList.add('fine');

  $('keys').innerHTML = isTouch
    ? '<span>이동</span><span>왼쪽 조이스틱</span><span>공격</span><span>오른쪽 빨간 버튼 (꾹 누르면 연속)</span><span>스킬</span><span>파란 버튼 (회전 베기)</span><span>대쉬</span><span>노란 버튼 (잠깐 무적)</span><span>가방</span><span>위쪽 가방 버튼</span><span>벌목</span><span>나무 앞에서 공격 버튼</span><span>시점</span><span>화면 드래그</span>'
    : '<span>이동</span><span>W A S D / 방향키</span><span>공격</span><span>마우스 좌클릭 (꾹 누르면 연속)</span><span>점프</span><span>Space (슬라임 공격 피하기)</span><span>대쉬</span><span>Shift (잠깐 무적)</span><span>가방</span><span>I</span><span>스킬</span><span>Q (ㅂ) 회전 베기</span><span>벌목</span><span>나무 앞에서 좌클릭</span><span>대화</span><span>E / Enter</span><span>시점</span><span>마우스 우클릭 드래그, 휠로 확대</span>';

  var renderer;
  try {
